# This workflow is managed by gh actions-lock.

name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4.2.2
    - name: Search cache
      uses: Swatinem/rust-cache@v2.7.7
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
